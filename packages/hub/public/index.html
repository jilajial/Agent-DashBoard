<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitt Meeting Hub</title><link rel="stylesheet" href="/css/app.css"></head><body><header><div><span class="signal"></span><b>PITT MEETING HUB</b><small>AGENT COMMAND OBSERVATORY</small></div><div id="clock"></div></header><main><section class="hero"><div><p class="eyebrow">MISSION CONTROL</p><h1>项目会议 · 节点监督 · 任务分发</h1><p class="muted">Pitt 协调 Jane、Bowen、Helen。所有高风险操作均进入人工确认队列。</p></div><div class="holo"><div class="orb"></div><span>HUB ONLINE</span></div></section><section id="nodes" class="grid"></section><section class="columns"><div class="panel"><h2>MEETING ROOM</h2><div id="messages" class="stream"></div><form id="messageForm"><input id="message" maxlength="2000" placeholder="向会议室发布消息…"><button>发送</button></form></div><div class="panel"><h2>TASK QUEUE</h2><div id="tasks" class="stream"></div><form id="taskForm"><input id="task" maxlength="200" placeholder="新任务"><select id="owner"><option>Jane</option><option>Bowen</option><option>Helen</option><option>Pitt</option></select><button>分发</button></form></div></section><section class="panel"><h2>EVENT STREAM</h2><div id="events" class="stream mono"></div></section></main><script src="/js/app.js"></script></body></html>
