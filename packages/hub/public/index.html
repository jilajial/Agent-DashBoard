<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents HQ</title><link rel="stylesheet" href="/css/app.css"></head><body><header><div class="brand"><span class="signal"></span><b>AGENTS HQ</b><small>LAN AGENT OPERATIONS</small></div><div class="header-right"><button id="identity" title="设置本浏览器显示名称">Jian</button><span id="clock"></span></div></header><main><section class="hero"><div><p class="eyebrow">AGENT OPERATIONS CENTER</p><h1>项目会议 · 私聊 · 任务分发</h1><p>Pitt 是协调 Agent；Agents HQ 是整个系统名称。新设备必须在本机批准后才能加入。</p></div><div class="hero-status"><span class="dot"></span>HQ ONLINE</div></section><section class="workspace"><aside class="sidebar"><section class="side-section pairing"><h2>PAIRING REQUESTS</h2><div id="pending" class="scroll-area"><span class="muted">等待局域网 Agent 注册…</span></div></section><section class="side-section agents"><h2>AUTHORIZED AGENTS</h2><div id="nodes" class="scroll-area"></div></section></aside><section class="meeting"><div class="meeting-head"><div><h2>MEETING ROOM</h2><div class="toolbar"><select id="conversation"><option value="topic:general"># general</option></select><span id="conversationHint" class="muted"></span></div></div></div><div id="messages" class="messages"><span class="muted">加载会话…</span></div><form id="messageForm" class="composer"><input id="message" maxlength="4000" placeholder="向当前会话发送消息…"><button>发送</button></form><details class="utility" open><summary>事件记录与任务分发 <span>点击收起 / 展开</span></summary><div class="utility-body"><section><h3>EVENT STREAM</h3><div id="events" class="events"></div></section><section><h3>TASK DISPATCH</h3><p class="muted">任务会直接投递给所选 Agent，并在相应私聊中接收回复。</p><form id="taskForm" class="task-form"><input id="task" maxlength="200" placeholder="任务内容"><select id="owner"></select><button>分发任务</button></form><div id="tasks" class="tasks"></div></section></div></details></section></section></main><script src="/js/app.js"></script></body></html>
