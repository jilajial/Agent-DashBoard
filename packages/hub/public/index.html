<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitt Meeting Hub</title><link rel="stylesheet" href="/css/app.css"></head><body><header><div><span class="signal"></span><b>PITT MEETING HUB</b><small>DISCOVERY · PAIRING · MEETING CONTROL</small></div><div id="clock"></div></header><main><section class="hero"><div><p class="eyebrow">MISSION CONTROL</p><h1>项目会议 · 私聊 · 任务分发</h1><p class="muted">Pitt 协调已授权节点。新节点必须由总控电脑本机批准后才能加入。</p></div><div class="holo"><div class="orb"></div><span>HUB ONLINE</span></div></section><section class="panel" id="pairingPanel"><h2>PAIRING REQUESTS</h2><div id="pending" class="stream"><span class="muted">等待局域网 Agent 注册…</span></div></section><section id="nodes" class="grid"></section><section class="columns"><div class="panel"><h2>MEETING ROOM</h2><div class="toolbar"><select id="conversation"><option value="topic:general"># general</option></select><span id="conversationHint" class="muted"></span></div><div id="messages" class="stream"></div><form id="messageForm"><input id="message" maxlength="4000" placeholder="向当前会话发送消息…"><button>发送</button></form></div><div class="panel"><h2>TASK QUEUE</h2><div id="tasks" class="stream"></div><form id="taskForm"><input id="task" maxlength="200" placeholder="新任务"><select id="owner"><option>Pitt</option></select><button>分发</button></form></div></section><section class="panel"><h2>EVENT STREAM</h2><div id="events" class="stream mono"></div></section></main><script src="/js/app.js"></script></body></html>
