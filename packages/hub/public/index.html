<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents HQ</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header><div class="brand"><span class="signal"></span><b>AGENTS HQ</b><small>LAN AGENT OPERATIONS</small></div><div class="header-right"><button id="identity">Jian</button><span id="clock"></span></div></header>
<main><section class="hero"><div><p class="eyebrow">AGENT OPERATIONS CENTER</p><h1>项目会议 · 私聊 · 任务分发</h1><p>新设备必须经本机登录后批准。</p></div><div class="hero-status"><span class="dot"></span>HQ ONLINE</div></section><section class="workspace"><aside class="sidebar"><section class="side-section pairing"><h2>PAIRING REQUESTS</h2><div id="pending" class="scroll-area"></div></section><section class="side-section agents"><h2>AUTHORIZED AGENTS</h2><div id="nodes" class="scroll-area"></div></section></aside><section class="meeting"><div class="meeting-head"><h2>MEETING ROOM</h2><div class="toolbar"><select id="conversation"><option value="topic:general"># general</option></select><span id="conversationHint" class="muted"></span></div></div><div id="messages" class="messages"></div><form id="messageForm" class="composer"><input id="message" maxlength="4000" placeholder="向当前会话发送消息…"><button>发送</button></form>
<details class="online-workbench" open><summary>在线咨询 / 工单</summary><div class="online-body"><section class="online-list"><div class="online-toolbar"><button id="onlineSync">同步</button><span id="onlineState" class="muted"></span></div><div class="role-controls"><select id="roleMember"></select><input id="roleValues" maxlength="160" placeholder="职位角色，以逗号分隔"><button id="roleSave">保存角色</button><button id="dutySave">设为值班</button></div><div id="onlineConversations"></div></section><section class="online-detail"><div id="onlineTitle" class="muted">选择一条在线咨询。</div><div id="onlineMessages" class="online-messages"></div><div class="online-actions"><select id="onlineAssignee"></select><input id="onlineRole" maxlength="60" placeholder="职位角色（可选）"><button id="onlineAssign">转交</button><button id="onlineDone">完成</button><button id="onlineDelete">删除完成记录</button></div><form id="onlineReply" class="composer"><input id="onlineReplyText" maxlength="4000" placeholder="回复网站访客…"><button>回复</button></form></section></div></details>
<details class="utility"><summary>事件记录与任务分发</summary><div class="utility-body"><section><h3>EVENT STREAM</h3><div id="events" class="events"></div></section><section><h3>TASK DISPATCH</h3><form id="taskForm" class="task-form"><input id="task" maxlength="200" placeholder="任务内容"><select id="owner"></select><button>分发任务</button></form><div id="tasks" class="tasks"></div></section></div></details></section></section></main>
<div id="authGate" class="auth-gate"><form id="authForm" class="auth-card"><h2 id="authTitle">HUB LOGIN</h2><p id="authHelp" class="muted"></p><input id="authPassword" type="password" minlength="12" placeholder="本机密码" required><input id="authConfirm" type="password" minlength="12" placeholder="确认密码" required><button>继续</button><p id="authError" class="bad"></p></form></div><script src="/js/app.js"></script><script src="/js/roles.js"></script></body></html>
